name: Refresh profile writing list

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-widgets.yml"
      - ".github/scripts/update_recent_writing.py"
      - "README.md"

permissions:
  contents: write

jobs:
  update-recent-writing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Refresh recent writing from the Atom feed
        run: python3 .github/scripts/update_recent_writing.py

      - name: Commit README update
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            echo "Recent writing is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent writing from blog feed"
          git push
