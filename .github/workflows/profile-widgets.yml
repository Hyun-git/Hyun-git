name: Update profile widgets

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-widgets.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  update-recent-writing:
    runs-on: ubuntu-latest
    steps:
      - name: Render recent blog posts from the Jekyll feed
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: metrics.plugin.rss.svg
          token: NOT_NEEDED
          base: ""
          plugin_rss: yes
          plugin_rss_source: https://hyun-git.github.io/feed.xml
          plugin_rss_limit: 3
